name: kitchen-dashboard
services:
  kitchen-dashboard-web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      kitchen-dashboard-api:
        condition: service_healthy
      kitchen-dashboard-camera:
        condition: service_healthy
    networks: [kitchen-dashboard-app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 4s
      retries: 5

  # WHEP stays inside the project network. WebRTC media reuses the dashboard's
  # existing port number over UDP and binds it only to the VPS Tailscale address.
  kitchen-dashboard-camera:
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    environment:
      TAPO_CAMERA_STREAM: ${TAPO_CAMERA_STREAM:?Set TAPO_CAMERA_STREAM in the protected production environment}
      CAMERA_WEBRTC_HOST: ${CAMERA_WEBRTC_BIND_IP:?Set CAMERA_WEBRTC_BIND_IP to the VPS Tailscale address}
      CAMERA_WEBRTC_HOST_PORT: ${APP_HTTP_PORT:-8080}
    volumes:
      - ./go2rtc.prod.yaml:/config/go2rtc.yaml:ro
    ports:
      - "${CAMERA_WEBRTC_BIND_IP:?Set CAMERA_WEBRTC_BIND_IP to the VPS Tailscale address}:${APP_HTTP_PORT:-8080}:8080/udp"
    restart: unless-stopped
    networks: [kitchen-dashboard-app]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:1984/api]
      interval: 15s
      timeout: 4s
      retries: 5

  kitchen-dashboard-api:
    build:
      context: ../backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_ENV: production
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
      AUTH_REMEMBER_TTL_DAYS: ${AUTH_REMEMBER_TTL_DAYS:-30}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set AUTH_ALLOWED_ORIGINS to the application origin}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      WEATHER_LOCATION_NAME: ${WEATHER_LOCATION_NAME:-Unna}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-51.537}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-7.689}
      CALENDAR_CACHE_TTL_SECONDS: ${CALENDAR_CACHE_TTL_SECONDS:-60}
      CALENDAR_SOURCES_JSON: ${CALENDAR_SOURCES_JSON:-[]}
      BRING_ENABLED: ${BRING_ENABLED:-false}
      BRING_EMAIL: ${BRING_EMAIL:-}
      BRING_PASSWORD: ${BRING_PASSWORD:-}
      BRING_LIST_UUID: ${BRING_LIST_UUID:-}
      CAMERA_MODE_TIMEOUT_MINUTES: ${CAMERA_MODE_TIMEOUT_MINUTES:-15}
      CAMERA_STREAM_URL: ${CAMERA_STREAM_URL:-/camera-stream/api/webrtc?src=tapo}
      MEDIA_ROOT: /data/media
      PHOTO_MAX_UPLOAD_BYTES: ${PHOTO_MAX_UPLOAD_BYTES:-20971520}
      PHOTO_MAX_DIMENSION: ${PHOTO_MAX_DIMENSION:-2560}
      PHOTO_THUMBNAIL_MAX_DIMENSION: ${PHOTO_THUMBNAIL_MAX_DIMENSION:-480}
      PHOTO_WEBP_QUALITY: ${PHOTO_WEBP_QUALITY:-88}
    volumes:
      - kitchen-dashboard-media-data:/data/media
    restart: unless-stopped
    depends_on:
      kitchen-dashboard-postgres:
        condition: service_healthy
    networks: [kitchen-dashboard-app, kitchen-dashboard-data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 4s
      retries: 5

  kitchen-dashboard-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - kitchen-dashboard-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [kitchen-dashboard-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 8

networks:
  kitchen-dashboard-app:
  kitchen-dashboard-data:
    internal: true

volumes:
  kitchen-dashboard-postgres-data:
  kitchen-dashboard-media-data:
