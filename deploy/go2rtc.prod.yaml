modules: [api, streams, rtsp, mp4]

streams:
  tapo:
    - "${TAPO_CAMERA_STREAM}"

# Nginx is the only browser-facing caller and enforces the dashboard session.
# The API/admin listener is not published on the VPS.
api:
  listen: ":1984"
  allow_paths: [/api, /api/stream.mp4]

# The RTSP module is needed as a client, but its restream server is disabled.
rtsp:
  listen: ""

# RTSP failures can include the source URL, so credentials must never reach logs.
log:
  level: disabled
