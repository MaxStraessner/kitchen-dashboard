modules: [api, streams, rtsp, mp4]

streams:
  tapo:
    - "${TAPO_CAMERA_STREAM}"

# This endpoint is only reachable inside kitchen-dashboard-app. Vite proxies the
# browser's same-origin /camera-stream request to it.
api:
  listen: ":1984"
  allow_paths: [/api, /api/stream.mp4]

rtsp:
  listen: ""

# Source failures may include an RTSP URL, so never write camera credentials to logs.
log:
  level: disabled
