name: kitchen-dashboard-camera

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    network_mode: host
    restart: unless-stopped
    environment:
      TAPO_CAMERA_STREAM: ${TAPO_CAMERA_STREAM:?Set TAPO_CAMERA_STREAM in the protected Raspberry Pi .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:1984/api]
      interval: 30s
      timeout: 4s
      retries: 5

  kiosk-gateway:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      DASHBOARD_UPSTREAM: ${DASHBOARD_UPSTREAM:?Set DASHBOARD_UPSTREAM in the Raspberry Pi .env}
      NGINX_ENVSUBST_FILTER: DASHBOARD_UPSTREAM
    volumes:
      - ./gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /etc/nginx/conf.d:size=4m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      go2rtc:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:8088/healthz]
      interval: 30s
      timeout: 4s
      retries: 5
