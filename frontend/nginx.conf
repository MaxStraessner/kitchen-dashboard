server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 21m;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  location = /api/v1/bring/events {
    proxy_pass http://kitchen-dashboard-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
  }

  location = /api/v1/camera/events {
    proxy_pass http://kitchen-dashboard-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
  }

  location = /_camera_stream_auth {
    internal;
    proxy_pass http://kitchen-dashboard-api:8000/api/v1/camera/status;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /camera-stream/api/webrtc {
    limit_except POST { deny all; }
    if ($args != "src=tapo") { return 404; }
    auth_request /_camera_stream_auth;
    proxy_pass http://kitchen-dashboard-camera:1984/api/webrtc;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_buffering off;
  }

  location /camera-stream/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://kitchen-dashboard-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
